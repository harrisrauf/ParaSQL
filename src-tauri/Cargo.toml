[package]
name = "parasql"
version = "0.2.0"
description = "The SQL workbench for Parquet files — query, explore, edit, and export data from any folder of Parquet."
authors = ["Harris Rauf"]
license = "MIT"
repository = "https://github.com/harrisrauf/ParaSQL"
homepage = "https://github.com/harrisrauf/ParaSQL"
edition = "2021"

[lib]
name = "parasql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
arrow = "59"
duckdb = { version = "1", features = ["bundled", "parquet", "vtab-arrow", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
chrono = "0.4"
rust_xlsxwriter = "0.95"

[dev-dependencies]
tempfile = "3"
