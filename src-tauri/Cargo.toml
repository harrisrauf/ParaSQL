[package]
name = "parquet-viewer"
version = "0.2.0"
description = "A Parquet file viewer and editor built with Tauri + DuckDB"
authors = ["you"]
edition = "2021"

[lib]
name = "parquet_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
arrow = "58"
duckdb = { version = "1", features = ["bundled", "parquet", "vtab-arrow", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
chrono = "0.4"
rust_xlsxwriter = "0.95"

[dev-dependencies]
tempfile = "3"
