name: Bug report
description: Report a reproducible problem with ParaSQL
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact steps to reproduce it.
      placeholder: |
        1. Open the demo workspace
        2. Run query X
        3. Click Y
        → expected ..., got ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ParaSQL version
      description: Shown in Help → About, or the release you downloaded.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error toasts, console output, or screenshots. Do not include sensitive data.
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: Data details (if relevant)
      description: How was the Parquet file produced (Spark, pandas, DuckDB, …), approx. row count, and compression codec. Do not attach private data.
    validations:
      required: false
